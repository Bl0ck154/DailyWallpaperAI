name: Classic compact WPF experiment
on:
  push:
    branches: [experiment/framework48-compact]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF targeting built-in .NET Framework 4.8
        run: dotnet build DailyWallpaperAI.Classic.csproj -c Release
      - name: Package Classic folder
        shell: pwsh
        run: |
          if (!(Test-Path bin/Release/net48/DailyWallpaperAI.exe)) { throw "Classic EXE missing" }
          $sources = Get-ChildItem bin/Release/net48 -File |
            Where-Object { $_.Extension -notin '.pdb','.xml' }
          New-Item -ItemType Directory -Force -Path dist/Classic | Out-Null
          $sources | Copy-Item -Destination dist/Classic/
          Compress-Archive -Path dist/Classic/* -DestinationPath dist/DailyWallpaperAI-Classic-win-x64.zip
          Write-Host ("ZIP size: {0} KB" -f [math]::Round((Get-Item dist/DailyWallpaperAI-Classic-win-x64.zip).Length / 1KB))
      - uses: actions/upload-artifact@v4
        with:
          name: DailyWallpaperAI-Classic-Windows
          path: dist/DailyWallpaperAI-Classic-win-x64.zip
          retention-days: 3
          if-no-files-found: error
